<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Customer - Xodim profili</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/input.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <style>
        .profile-container {
            padding: 20px 24px;
            max-width: 800px;
            margin: 0 auto;
        }

        .profile-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 32px;
            border: 1px solid var(--border-color);
        }

        .profile-card .header {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .profile-card .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--text-primary);
            color: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .profile-card .info h2 {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .profile-card .info .position {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .profile-card .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .profile-card .details .item {
            padding: 12px 16px;
            background: var(--bg-hover);
            border-radius: 8px;
        }

        .profile-card .details .item .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .profile-card .details .item .value {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-top: 2px;
        }

        .profile-card .salary-breakdown {
            margin-top: 20px;
            padding: 16px 20px;
            background: var(--bg-hover);
            border-radius: 8px;
        }

        .profile-card .salary-breakdown .title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .profile-card .salary-breakdown .row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.85rem;
        }

        .profile-card .salary-breakdown .row .label {
            color: var(--text-muted);
        }

        .profile-card .salary-breakdown .row .value {
            font-weight: 600;
            color: var(--text-primary);
        }

        .profile-card .payment-warning {
            margin-top: 16px;
            padding: 12px 16px;
            background: #fff3e0;
            border-radius: 8px;
            border-left: 4px solid #ff9500;
        }

        .profile-card .payment-warning .title {
            font-size: 0.8rem;
            font-weight: 600;
            color: #e65100;
        }

        .profile-card .payment-warning .text {
            font-size: 0.75rem;
            color: #bf360c;
            margin-top: 4px;
        }

        [data-theme="dark"] .profile-card .payment-warning {
            background: #3a2a1a;
            border-left-color: #ff9500;
        }

        [data-theme="dark"] .profile-card .payment-warning .title {
            color: #ff9a4a;
        }

        [data-theme="dark"] .profile-card .payment-warning .text {
            color: #ffb74d;
        }

        @media (max-width: 768px) {
            .profile-container { padding: 12px 16px; }
            .profile-card { padding: 20px; }
            .profile-card .header { flex-direction: column; text-align: center; }
            .profile-card .details { grid-template-columns: 1fr; }
            .top-header { padding: 12px 16px; }
            .header-left .text-muted { display: none; }
            .user-info { display: none; }
        }
    </style>
</head>
<body>
    <div class="app-container">

            <nav class="sidebar-nav">

                <a href="attendance.html" class="nav-link">

                <a href="reports.html" class="nav-link">

                <a href="subjects.html" class="nav-link">

                <a href="all.html" class="nav-link">

                <a href="notifications.html" class="nav-link">

        <!-- SIDEBAR OVERLAY -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <!-- TOP HEADER -->
            <header class="top-header">
                <div class="header-left">
                    <button id="menuToggle" class="menu-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div>
                        <h2><i class="fas fa-user-circle"></i> Xodim profili</h2>

                    </div>
                </div>
                <div class="header-right">
                    <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle theme">
                        <i class="fas fa-moon moon-icon"></i>
                        <i class="fas fa-sun sun-icon"></i>
                    </button>
                    <div class="user-profile">
                        <div class="user-avatar"><span id="userInitial">A</span></div>
                        <div class="user-info">
                            <p class="user-name" id="userName"><i class="fas fa-user"></i> Xoijakbar Xasan</p>
                            <p class="user-role text-muted"><i class="fas fa-user-shield"></i> Admin Customer</p>
                        </div>
                    </div>
                </div>
            </header>

            <!-- PROFILE CONTENT -->
            <section class="profile-container" id="profileContainer">
                <div class="profile-card" id="profileCard">
                    <div class="text-center text-muted" style="padding: 40px 0;">
                        <div class="loading-spinner"></div>
                        <p>Yuklanmoqda...</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" style="display:none;">
        <i class="fas fa-moon moon"></i>
        <i class="fas fa-sun sun"></i>

</body>
