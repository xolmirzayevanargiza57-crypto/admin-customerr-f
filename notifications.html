<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Customer - Bildirishnomalar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/input.css" />
    <link rel="stylesheet" href="css/modal.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/theme.css" />

    <style>
        /* ============================================================
           NOTIFICATIONS PAGE STYLES - ADMIN CUSTOMER
           ============================================================ */
        .notifications-container {
            padding: 16px 24px 24px 24px;
            max-width: 900px;
            margin: 0 auto;
        }

        .notifications-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ⭐ NOTIFICATION ITEM - CARD ICHIDA SCROLL */
        .notification-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            max-width: 100%;
            overflow: hidden;
        }

        .notification-item:hover {
            border-color: var(--text-muted);
        }

        .notification-item.unread {
            border-left: 4px solid #007aff;
            background: var(--bg-hover);
        }

        /* ⭐ BODY - MATN SCROLL QILADIGAN QISM */
        .notification-body {
            flex: 1;
            min-width: 0;
            max-width: 100%;
            overflow: hidden;
        }

        .notification-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
            display: block;
            margin-bottom: 4px;
            word-break: break-word;
        }

        /* ⭐ MESSAGE WRAPPER - SCROLL QILADIGAN QISM */
        .notification-message-wrapper {
            max-height: 80px;
            overflow-y: auto;
            overflow-x: auto;
            padding-right: 4px;
            margin: 4px 0;
            word-wrap: break-word;
            word-break: break-word;
            white-space: pre-wrap;
            line-height: 1.5;
        }

        /* ⭐ SCROLLBAR STILLARI */
        .notification-message-wrapper::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        .notification-message-wrapper::-webkit-scrollbar-track {
            background: var(--bg-hover);
            border-radius: 10px;
        }

        .notification-message-wrapper::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        .notification-message-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .notification-message {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin: 0;
            word-break: break-word;
            white-space: pre-wrap;
            line-height: 1.5;
            min-width: 0;
            max-width: 100%;
        }

        .notification-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .notification-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
            align-items: center;
        }

        .btn-read {
            background: none;
            border: 1px solid #007aff;
            color: #007aff;
            font-size: 0.7rem;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 6px;
            transition: all 0.2s ease;
            white-space: nowrap;
            font-family: var(--font-family);
        }

        .btn-read:hover {
            background: #007aff;
            color: #fff;
        }

        .read-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            padding: 4px 0;
        }

        .notification-empty {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
        }

        .notification-empty i {
            font-size: 3rem;
            display: block;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        /* ============================================================
           FILTER BAR
           ============================================================ */
        .filter-bar {
            padding: 12px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-header);
        }

        .filter-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-pill {
            padding: 6px 14px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.78rem;
            background: var(--bg-input);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-family);
        }

        .filter-pill:hover {
            border-color: var(--text-muted);
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .filter-pill.active {
            border-color: #007aff;
            background: #007aff;
            color: #fff;
        }

        [data-theme="dark"] .filter-pill.active {
            border-color: #4a9aff;
            background: #1a2a4a;
            color: #4a9aff;
        }

        .filter-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-left: auto;
        }

        .filter-actions .btn-secondary {
            padding: 6px 14px;
            font-size: 0.78rem;
            width: auto;
        }

        /* ============================================================
           BACK BUTTON - MOBILE
           ============================================================ */
        .back-button {
            display: none;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-primary);
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
        }

        .back-button:hover {
            background: var(--bg-hover);
        }

        .menu-toggle {
            display: none !important;
        }

        /* ============================================================
           XATOLIK XABARI
           ============================================================ */
        #notificationError {
            display: none;
            padding: 12px 16px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #dc2626;
            margin: 0 24px 12px 24px;
            font-size: 0.85rem;
            align-items: center;
            gap: 10px;
        }

        #notificationError.show {
            display: flex;
        }

        [data-theme="dark"] #notificationError {
            background: #3a1a1a;
            border-color: #ff3b30;
            color: #ff3b30;
        }

        /* ============================================================
           TOAST XABAR
           ============================================================ */
        .notification-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 99999;
            background: #007aff;
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            font-size: 0.95rem;
            max-width: 400px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideDown 0.5s ease;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .notification-toast button {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            margin-left: auto;
        }

        [data-theme="dark"] .notification-toast {
            background: #1a2a4a;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .back-button {
                display: flex !important;
            }

            .notifications-container {
                padding: 12px 16px 16px 16px;
            }

            .filter-bar {
                padding: 10px 16px;
                flex-direction: column;
                align-items: stretch;
            }

            .filter-actions {
                margin-left: 0;
            }

            .notification-item {
                flex-direction: column;
            }

            .notification-actions {
                width: 100%;
                justify-content: flex-end;
            }

            .notification-meta {
                gap: 8px;
                font-size: 0.65rem;
            }

            .top-header {
                padding: 12px 16px;
            }

            .header-left .text-muted {
                display: none;
            }

            .user-info {
                display: none;
            }

            .sidebar {
                display: none !important;
            }

            .main-content {
                margin-left: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
            }

            #notificationError {
                margin: 0 16px 12px 16px;
            }
        }

        @media (max-width: 480px) {
            .filter-pill {
                font-size: 0.7rem;
                padding: 4px 10px;
            }

            .notification-title {
                font-size: 0.85rem;
            }

            .notification-message {
                font-size: 0.78rem;
            }

            .top-header h2 {
                font-size: 0.95rem;
            }

            .notification-message-wrapper {
                max-height: 60px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- ==================== MAIN CONTENT ==================== -->

            <div id="notificationError">

            <!-- FILTER BAR -->
            <div class="filter-bar">

                    <button class="filter-pill" data-filter="month">Shu oy</button>

                <div class="filter-actions">

                    <button id="markAllReadBtn" class="btn-secondary"><i class="fas fa-check-double"></i> Hammasini o'qildi</button>

            <!-- NOTIFICATIONS LIST -->
            <section class="notifications-container">
