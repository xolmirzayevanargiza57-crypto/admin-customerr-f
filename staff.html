<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Customer - Xodimlar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/input.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    <style>
        /* ============================================================
           STAFF PAGE STYLES
           ============================================================ */
        .staff-container {
            padding: 16px 24px 24px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .staff-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .staff-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .staff-header h3 i {
            margin-right: 8px;
            color: var(--text-muted);
        }

        .staff-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .staff-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            transform: none !important;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
        }

        .staff-card:hover {
            box-shadow: var(--shadow-hover);
            transform: none !important;
            border-color: var(--text-muted);
        }

        .staff-card .staff-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .staff-card .staff-icon.blue {
            background: #e8f0fe;
            color: #007aff;
        }
        .staff-card .staff-icon.green {
            background: #e8f5e9;
            color: #34c759;
        }
        .staff-card .staff-icon.purple {
            background: #f3e8ff;
            color: #7c3aed;
        }
        .staff-card .staff-icon.orange {
            background: #fff3e0;
            color: #ff9500;
        }
        .staff-card .staff-icon.red {
            background: #fef2f2;
            color: #ff3b30;
        }
        .staff-card .staff-icon.teal {
            background: #e0f7fa;
            color: #00bcd4;
        }

        [data-theme="dark"] .staff-card .staff-icon.blue {
            background: #1a2a4a;
            color: #4a9aff;
        }
        [data-theme="dark"] .staff-card .staff-icon.green {
            background: #1a3a2a;
            color: #4ac759;
        }
        [data-theme="dark"] .staff-card .staff-icon.purple {
            background: #2a1a4a;
            color: #9a6aff;
        }
        [data-theme="dark"] .staff-card .staff-icon.orange {
            background: #3a2a1a;
            color: #ff9a4a;
        }
        [data-theme="dark"] .staff-card .staff-icon.red {
            background: #3a1a1a;
            color: #ff6b6b;
        }
        [data-theme="dark"] .staff-card .staff-icon.teal {
            background: #1a2a3a;
            color: #4ad4e8;
        }

        .staff-card .staff-info {
            flex: 1;
        }

        .staff-card .staff-info .staff-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .staff-card .staff-info .staff-role {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .staff-card .staff-info .staff-count {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-top: 2px;
        }

        .staff-card .staff-arrow {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .staff-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }

        .staff-empty i {
            font-size: 3rem;
            display: block;
            margin-bottom: 12px;
            opacity: 0.3;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .staff-container {
                padding: 12px 16px 16px 16px;
            }

            .staff-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .staff-grid {
                grid-template-columns: 1fr;
            }

            .staff-card {
                padding: 16px 18px;
            }

            .top-header {
                padding: 12px 16px;
            }

            .header-left .text-muted {
                display: none;
            }

            .user-info {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .staff-card {
                padding: 14px 16px;
            }

            .staff-card .staff-icon {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .staff-card .staff-info .staff-name {
                font-size: 0.85rem;
            }

            .staff-card .staff-info .staff-role {
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon"><i class="fas fa-crown"></i></div>
                <div class="brand-text">
                    <span class="brand-name">Admin Customer</span>
                    <span class="brand-version">v1.0</span>
                </div>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link">
                    <i class="fas fa-chart-pie"></i> <span data-i18n="dashboard">Dashboard</span>
                </a>
                <a href="staff.html" class="nav-link active">
                    <i class="fas fa-users"></i> <span data-i18n="staff">Xodimlar</span>
                </a>
                <a href="teachers.html" class="nav-link">
                    <i class="fas fa-chalkboard-teacher"></i> <span data-i18n="teachers">O'qituvchilar</span>
                </a>
                <a href="students.html" class="nav-link">
                    <i class="fas fa-graduation-cap"></i> <span data-i18n="students">O'quvchilar</span>
                </a>
                <a href="payments.html" class="nav-link">
                    <i class="fas fa-money-bill"></i> <span data-i18n="payments">To'lovlar</span>
                </a>
                <a href="attendance.html" class="nav-link">
                    <i class="fas fa-calendar-check"></i> <span data-i18n="attendance">Davomat</span>
                </a>
                <a href="reports.html" class="nav-link">
                    <i class="fas fa-file-alt"></i> <span data-i18n="reports">Hisobotlar</span>
                </a>
                <a href="subjects.html" class="nav-link">
                    <i class="fas fa-book"></i> <span data-i18n="subjects">Fanlar</span>
                </a>
                <a href="all.html" class="nav-link">
                    <i class="fas fa-th-list"></i> <span data-i18n="all">Barchasi</span>
                </a>
                <a href="notifications.html" class="nav-link">
                    <i class="fas fa-bell"></i> <span data-i18n="notifications">Bildirishnomalar</span>
                    <span class="sidebar-badge" id="sidebarBadge" style="display:none;">0</span>
                </a>
                <a href="settings.html" class="nav-link">
                    <i class="fas fa-cog"></i> <span data-i18n="settings">Sozlamalar</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i> <span data-i18n="logout">Chiqish</span>
                </button>
            </div>
        </aside>

        <!-- SIDEBAR OVERLAY -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <!-- TOP HEADER -->
            <header class="top-header">
                <div class="header-left">
                    <button id="menuToggle" class="menu-toggle">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div>
                        <h2><i class="fas fa-users"></i> <span data-i18n="staff">Xodimlar</span></h2>
                        <p class="text-muted"><i class="fas fa-users"></i> Barcha xodimlar ro'yxati</p>
                    </div>
                </div>
                <div class="header-right">
                    <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle theme">
                        <i class="fas fa-moon moon-icon"></i>
                        <i class="fas fa-sun sun-icon"></i>
                    </button>
                    <div class="user-profile">
                        <div class="user-avatar"><span id="userInitial">A</span></div>
                        <div class="user-info">
                            <p class="user-name" id="userName"><i class="fas fa-user"></i> Xoijakbar Xasan</p>
                            <p class="user-role text-muted"><i class="fas fa-user-shield"></i> Admin Customer</p>
                        </div>
                    </div>
                </div>
            </header>

            <!-- STAFF CONTENT -->
            <section class="staff-container">
                <div class="staff-header">
                    <h3><i class="fas fa-users"></i> Xodimlar ro'yxati</h3>
                    <div style="display:flex; gap:8px; flex-wrap:wrap;">
                        <button class="btn-primary" style="width:auto; padding:8px 18px; font-size:0.8rem;" onclick="window.location.href='teachers.html'">
                            <i class="fas fa-chalkboard-teacher"></i> O'qituvchilar
                        </button>
                        <button class="btn-primary" style="width:auto; padding:8px 18px; font-size:0.8rem; background: var(--color-purple);" onclick="window.location.href='students.html'">
                            <i class="fas fa-graduation-cap"></i> O'quvchilar
                        </button>
                    </div>
                </div>

                <div class="staff-grid" id="staffGrid">
                    <div class="staff-empty">
                        <i class="fas fa-spinner fa-spin"></i>
                        <p>Yuklanmoqda...</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Theme Toggle (Floating) -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" style="display:none;">
        <i class="fas fa-moon moon"></i>
        <i class="fas fa-sun sun"></i>
    </button>

    <script>
        window.__API_BASE_URL__ = 'https://admin-customerr.onrender.com';

        document.addEventListener('DOMContentLoaded', function() {
            // Theme toggle
            var themeBtn = document.getElementById('themeToggleBtn');
            if (themeBtn) {
                themeBtn.addEventListener('click', function() {
                    var html = document.documentElement;
                    var newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                    html.setAttribute('data-theme', newTheme);
                    localStorage.setItem('theme', newTheme);
                });
            }

            // Hamburger menu
            var menuToggle = document.getElementById('menuToggle');
            var sidebar = document.getElementById('sidebar');
            var overlay = document.getElementById('sidebarOverlay');

            if (menuToggle && sidebar) {
                menuToggle.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    sidebar.classList.toggle('open');
                    if (overlay) {
                        overlay.classList.toggle('show');
                    }
                });
            }

            if (overlay) {
                overlay.addEventListener('click', function() {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('show');
                });
            }

            document.addEventListener('click', function(e) {
                if (window.innerWidth <= 768) {
                    var isSidebar = sidebar.contains(e.target);
                    var isToggle = menuToggle.contains(e.target);
                    if (!isSidebar && !isToggle && sidebar.classList.contains('open')) {
                        sidebar.classList.remove('open');
                        if (overlay) overlay.classList.remove('show');
                    }
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                    if (overlay) overlay.classList.remove('show');
                }
            });

            window.addEventListener('resize', function() {
                if (window.innerWidth > 768 && sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                    if (overlay) overlay.classList.remove('show');
                }
            });

            if (window.innerWidth <= 768) {
                sidebar.classList.remove('open');
                if (overlay) overlay.classList.remove('show');
            }

            // ⭐ STAFF MA'LUMOTLARINI YUKLASH
            loadStaffData();
        });

        // ============================================================
        // STAFF MA'LUMOTLARINI YUKLASH
        // ============================================================
        async function loadStaffData() {
            try {
                const grid = document.getElementById('staffGrid');

                // Foydalanuvchi ma'lumotlarini ko'rsatish
                const user = Auth.getUser();
                if (user) {
                    document.getElementById('userName').textContent = user.fullName || 'Admin';
                    document.getElementById('userInitial').textContent = Auth.getUserInitial();
                }

                // API dan ma'lumotlarni olish
                const [teachersRes, studentsRes] = await Promise.all([
                    fetch(window.__API_BASE_URL__ + '/api/teachers', {
                        headers: {
                            'Authorization': 'Bearer ' + (localStorage.getItem('customerToken') || sessionStorage.getItem('customerToken'))
                        }
                    }),
                    fetch(window.__API_BASE_URL__ + '/api/students', {
                        headers: {
                            'Authorization': 'Bearer ' + (localStorage.getItem('customerToken') || sessionStorage.getItem('customerToken'))
                        }
                    })
                ]);

                const teachersData = await teachersRes.json();
                const studentsData = await studentsRes.json();

                const teachers = teachersData.success ? teachersData.data || [] : [];
                const students = studentsData.success ? studentsData.data || [] : [];

                // Xodimlar ma'lumotlari
                const staffData = [
                    {
                        id: 'teachers',
                        name: 'O\'qituvchilar',
                        icon: 'fa-chalkboard-teacher',
                        color: 'green',
                        count: teachers.length,
                        active: teachers.filter(t => t.status === 'active').length,
                        link: 'teachers.html'
                    },
                    {
                        id: 'students',
                        name: 'O\'quvchilar',
                        icon: 'fa-graduation-cap',
                        color: 'purple',
                        count: students.length,
                        active: students.filter(s => s.status === 'active').length,
                        link: 'students.html'
                    },
                    {
                        id: 'total',
                        name: 'Jami Xodimlar',
                        icon: 'fa-users',
                        color: 'blue',
                        count: teachers.length + students.length,
                        active: teachers.filter(t => t.status === 'active').length + students.filter(s => s.status === 'active').length,
                        link: '#'
                    }
                ];

                renderStaff(staffData);

            } catch (error) {
                console.error('❌ Xodimlar yuklash xatosi:', error);
                document.getElementById('staffGrid').innerHTML = `
                    <div class="staff-empty">
                        <i class="fas fa-exclamation-circle" style="color: var(--color-danger);"></i>
                        <p>Ma'lumotlar yuklanmadi. Qayta urinib ko'ring.</p>
                        <button class="btn-secondary" style="width:auto; margin-top:12px; padding:8px 20px;" onclick="loadStaffData()">
                            <i class="fas fa-sync-alt"></i> Qayta yuklash
                        </button>
                    </div>
                `;
            }
        }

        // ============================================================
        // STAFF RENDER QILISH
        // ============================================================
        function renderStaff(staff) {
            const grid = document.getElementById('staffGrid');

            if (!staff || staff.length === 0) {
                grid.innerHTML = `
                    <div class="staff-empty">
                        <i class="fas fa-users"></i>
                        <p>Xodimlar mavjud emas</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = staff.map(item => `
                <div class="staff-card" onclick="window.location.href='${item.link}'">
                    <div class="staff-icon ${item.color}">
                        <i class="fas ${item.icon}"></i>
                    </div>
                    <div class="staff-info">
                        <div class="staff-name">${item.name}</div>
                        <div class="staff-role">Jami: ${item.count} ta</div>
                        <div class="staff-count">✅ Faol: ${item.active} ta</div>
                    </div>
                    <div class="staff-arrow">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
            `).join('');
        }
    </script>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/utils.js"></script>
</body>
</html>
